<!DOCTYPE html>
<html>

<head>

    <title>BuyBloom - Register</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <div class="logo">
        🛒 BuyBloom
    </div>

    <div class="nav-links">

        <a href="/">Home</a>
        <a href="/products">Products</a>
        <a href="/login">Login</a>

    </div>

</nav>


<div class="auth-container">

    <div class="auth-card">

        <h2>Create Account ✨</h2>

        <p>Join BuyBloom today</p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button type="submit"
                    class="primary-btn">
                Create Account
            </button>

        </form>

        <p class="auth-link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</div>

</body>
</html>
